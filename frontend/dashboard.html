<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | Blog Platform</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="navbar">
      <div class="container nav-inner">
        <a href="index.html" class="brand">BlogHub</a>
        <nav class="nav-links">
          <a href="index.html">Home</a>
          <a href="dashboard.html">Dashboard</a>
          <a href="login.html" id="loginLink">Login</a>
          <a href="#" id="logoutLink" class="hidden">Logout</a>
        </nav>
      </div>
    </header>

    <main class="container dashboard-page">
      <section class="dashboard-header">
        <div>
          <p class="eyebrow">Your content</p>
          <h1>Dashboard</h1>
        </div>
        <a href="create-post.html" class="btn btn-primary">Create New Post</a>
      </section>

      <section class="stats-grid">
        <div class="stat-card">
          <h3 id="postCount">0</h3>
          <p>Total posts</p>
        </div>
        <div class="stat-card">
          <h3 id="commentCount">0</h3>
          <p>Total comments</p>
        </div>
      </section>

      <section class="create-post-section" style="margin-bottom: 2rem;">
        <h2>Create a New Post</h2>
        <form id="dashboardCreateForm" class="form-card">
          <input type="text" id="dashboardTitle" placeholder="Post title" required />
          <textarea id="dashboardContent" rows="6" placeholder="Write your post..." required></textarea>
          <input type="text" id="dashboardCategory" placeholder="Category" />
          <input type="file" id="dashboardImage" accept="image/*" />
          <button type="submit" class="btn btn-primary">Publish Post</button>
        </form>
      </section>

      <section>
        <h2>Your Posts</h2>
        <div id="dashboardPosts" class="posts-grid"></div>
      </section>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/posts.js"></script>
  </body>
</html>
